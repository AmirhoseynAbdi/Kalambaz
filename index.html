        <h1 style="font-size: 1.8rem; color: #86efac; margin-bottom: 1rem;">کلمباز | بهترین بازی کلمه، کلمه بازی و ووردل فارسی (Wordle)</h1>
        <p style="font-size: 1.1rem; margin-bottom: 1.5rem;">
          کلمباز (Kalambaz) یک بازی آنلاین و رایگان حدس کلمات روزانه فارسی در سه سطح ۴، ۵ و ۶ حرفی است. اگر به دنبال کلمه بازی، بازی کلمات فکری و نسخه اختصاصی ووردل فارسی هستید، کلمباز هر روز با معماهای هیجان‌انگیز ذهن و هوش کلامی شما را تقویت می‌کند.
        </p>
        <h2 style="font-size: 1.4rem; color: #d8b4fe; margin-top: 1.5rem;">راهنما و قوانین بازی ووردل فارسی</h2>
        <ul style="padding-right: 1.5rem; margin-bottom: 1.5rem;">
          <li><strong>رنگ سبز:</strong> حرف انتخاب‌شده در کلمه وجود دارد و دقیقاً در همین مکان قرار گرفته است.</li>
          <li><strong>رنگ زرد:</strong> حرف انتخاب‌شده در کلمه وجود دارد اما باید در خانه دیگری قرار بگیرد.</li>
          <li><strong>رنگ خاکستری:</strong> این حرف به هیچ وجه در کلمه روز استفاده نشده است.</li>
        </ul>
        <h2 style="font-size: 1.4rem; color: #d8b4fe;">چرا کلمباز محبوب‌ترین بازی کلمات است؟</h2>
        <p>پشتیبانی از کلمات ۴، ۵ و ۶ حرفی، کیبورد اختصاصی فارسی، حالت سخت (Hard Mode)، ذخیره خودکار رکوردها و استریک بدون نیاز به نصب هرگونه نرم‌افزار اضافی.</p>
